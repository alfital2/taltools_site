<!-- The stable download URL the Mac companion is fetched from.
     Versioned filenames get frozen into every build that ships with them, so
     each release had to overwrite the previous release's filename to rescue
     users who were already mismatched. Padoo 1.2 onward asks for this address
     instead; retargeting a future release is a one-line edit here rather than
     a re-upload of the previous name. -->
<meta http-equiv="refresh" content="0;url=/padoo/PadooMac-1.3.dmg" />

<link rel="canonical" href="https://taltools.site/padoo/update" />

  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f8ff;color:#0d1220;
    font:17px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif}
  main{text-align:center;padding:24px}
  a{color:#1e2a8c;font-weight:600}
</style>
</head>
<body>
<main>
  <p>Downloading the Padoo companion for Mac.</p>
